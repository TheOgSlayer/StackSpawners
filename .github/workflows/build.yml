name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build with Maven
        run: mvn -B clean package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: StackSpawners
          path: target/StackSpawners-1.0.0.jar
