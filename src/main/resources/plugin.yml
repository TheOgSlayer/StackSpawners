name: StackSpawners
main: me.stackspawners.StackSpawners
version: 1.0.0
api-version: '1.20'
softdepend: [Vault]
description: Stackable virtual spawners that store drops and exp instead of spawning mobs.
commands:
  givespawner:
    description: Give stackable spawners to a player
    usage: /givespawner <player> <mob> <amount>
    permission: stackspawners.give
permissions:
  stackspawners.give:
    description: Allows /givespawner
    default: op
